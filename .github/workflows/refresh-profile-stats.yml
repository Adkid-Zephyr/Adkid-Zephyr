name: Refresh profile evidence

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Refresh generated profile evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py

      - name: Validate generated SVG files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for svg in Path("assets").rglob("*.svg"):
              ET.parse(svg)
          PY

      - name: Commit changed profile evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          git diff --cached --quiet || git commit -m "Update profile evidence"
          git push
