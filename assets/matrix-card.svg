<svg width="1200" height="250" viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020604"/>
      <stop offset="0.58" stop-color="#04100A"/>
      <stop offset="1" stop-color="#020604"/>
    </linearGradient>
    <linearGradient id="line" x1="28" y1="0" x2="1172" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00FF66" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00FF66" stop-opacity="0.85"/>
      <stop offset="0.8" stop-color="#00FF66" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00FF66" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(330 130) rotate(12) scale(410 220)">
      <stop stop-color="#00FF66" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#00FF66" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#89FFB6" stroke-opacity="0.035"/>
    </pattern>
    <filter id="soft-glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="248" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
